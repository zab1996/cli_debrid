# Isolated cli_debrid 2.0 instance: separate port, data dir and mount path.
services:
  cli_debrid_v2:
    build: .
    container_name: cli_debrid_v2
    ports:
      - "5060:5060"
    volumes:
      - ${CLID2_DATA_DIR:-./data}:/data
      # Mount point shared with the host (and Plex) so the media is visible outside.
      - ${CLID2_MOUNT_DIR:-./mnt}:/mnt/clid2:rshared
      # Library roots for symlinks; Plex must see the same paths.
      - ${CLID2_MEDIA_DIR:-./media}:/media
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
