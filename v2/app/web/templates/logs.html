{% extends "base.html" %}
{% block content %}
<div class="head">
  <h1>Logs</h1>
  <form method="get" class="filters" style="margin:0">
    <input id="logFilter" placeholder="Filter lines" style="width:220px">
    <select name="which" onchange="this.form.submit()">
      <option value="app" {{ 'selected' if which == 'app' }}>App log</option>
      <option value="engine" {{ 'selected' if which == 'engine' }}>Mount engine log</option>
    </select>
    <select name="lines" onchange="this.form.submit()">
      {% for n in (300, 1000, 5000) %}<option value="{{ n }}" {{ 'selected' if n == lines }}>Last {{ n }} lines</option>{% endfor %}
    </select>
  </form>
</div>
<pre class="log" id="log">{{ text }}</pre>
<script>
  const l = document.getElementById('log'); const all = l.textContent; l.scrollTop = l.scrollHeight;
  document.getElementById('logFilter').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    l.textContent = q ? all.split('\n').filter(x => x.toLowerCase().includes(q)).join('\n') : all;
    l.scrollTop = l.scrollHeight;
  });
</script>
{% endblock %}
