name: Fork test image

# Builds a test image from any branch of this fork and pushes it to
# ghcr.io/zab1996/cli_debrid:<tag>. Fork-only: uses the repo's own
# GITHUB_TOKEN, not the upstream Docker Hub secrets.
#
#   gh workflow run fork-test-image.yml -R zab1996/cli_debrid \
#     -f ref=fix/phalanx-bundled-startup -f tag=pr531

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: fix/phalanx-bundled-startup
      tag:
        description: Image tag (ghcr.io/zab1996/cli_debrid:<tag>)
        required: true
        default: pr531

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zab1996/cli_debrid

jobs:
  build:
    if: github.repository_owner == 'zab1996'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fork-${{ inputs.tag }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-${{ inputs.tag }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository_owner == 'zab1996'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          sha=$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          docker buildx imagetools create \
            -t "$IMAGE:${{ inputs.tag }}" \
            -t "$IMAGE:${{ inputs.tag }}-$sha" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Summary
        run: |
          sha=$(git rev-parse --short HEAD)
          {
            echo "Built \`${{ inputs.ref }}\` @ \`$sha\` (version $(cat version.txt))"
            echo
            echo "    docker pull $IMAGE:${{ inputs.tag }}"
            echo "    docker pull $IMAGE:${{ inputs.tag }}-$sha"
          } >> "$GITHUB_STEP_SUMMARY"
